<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Local assistant test form</title></head><body>
<h1>Application Assistant — local manual test</h1><p>No employer connection. Submission displays a local result.</p>
<form id="application">
<label>First name <input name="firstName" required></label><br>
<label>Last name <input name="lastName"></label><br>
<label>Email address <input type="email" name="email"></label><br>
<label>Phone number <input type="tel" name="phone"></label><br>
<label>LinkedIn profile <input type="url" name="linkedin"></label><br>
<label>Years using Laravel <input type="number" name="laravelYears" step="0.5"></label><br>
<label>Notice period <select name="notice"><option value="">Choose</option><option>Immediate</option><option>30 days</option><option>60 days</option></select></label><br>
<fieldset><legend>Are you authorized to work in India?</legend><label><input type="radio" name="workAuthorization" value="yes">Yes</label><label><input type="radio" name="workAuthorization" value="no">No</label></fieldset>
<label>Are you willing to relocate? <input type="checkbox" name="relocation"></label><br>
<label>Resume <input type="file" name="resume" accept=".pdf,.doc,.docx"></label><br>
<label>Why do you want to work here? <textarea name="motivation"></textarea></label><br>
<label>Keep this existing value <input value="Do not overwrite"></label><br>
<label>I agree to the terms <input type="checkbox" name="consent"></label><br>
<input type="hidden" name="tracking" value="must not change">
<button type="submit">Manually submit this local test</button></form><p id="result" role="status"></p>
<script>document.getElementById('application').addEventListener('submit',event=>{event.preventDefault();document.getElementById('result').textContent='Manually submitted locally. No data was sent.';});</script>
</body></html>
